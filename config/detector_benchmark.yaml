# Section 3: detector benchmark settings
video_path: "input/store_cctv.mp4"
output_csv: "reports/detector_benchmark.csv"
sample_frames: 60
confidence: 0.25
iou: 0.45
classes: [0]          # COCO class 0 = person
warmup_runs: 2
benchmark_runs: 3
# GTX 1650 has 4 GB VRAM. Start with small models and moderate resolutions.
models:
  - "yolov8n.pt"
  - "yolov8s.pt"
image_sizes:
  - 416
  - 640
allow_cpu: true
